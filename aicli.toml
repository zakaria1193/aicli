# aicli's one config file. Everything a caller needs to know about the
# `claude` and `agy` CLIs - binary paths, model tiers, standard flags - lives
# here. This is the default; a deployment can put its own at
# ~/.config/aicli/aicli.toml or point AICLI_CONFIG at it.

usage_timeout = 30

[claude]
bin = "~/.local/bin/claude"
args = []
model_flag = "--model"
effort_flag = "--effort"

[claude.tiers]
low = "claude-haiku-5-5"
default = "claude-sonnet-5"
deep = "claude-opus-5-5"

[agy]
bin = "~/.local/bin/agy"
args = []
model_flag = "--model"
effort_flag = "--effort"
# Each agy model names its effort, and agy rejects an --effort that differs:
# when aicli adds the tier's model it drops the effort, so the tier decides.
model_sets_effort = true

[agy.tiers]
low = "gemini-3.8-flash-low"
default = "gemini-3.8-flash-high"
deep = "gemini-3.8-flash-high"

# --- Fallback -----------------------------------------------------------------
# Once a plan's five-hour or weekly bar reaches `at` percent, `aicli resolve`
# and `aicli run` move its runs to the first step below that still has room
# (`aicli fallback` shows the chain). agy meters its Claude models apart from
# Gemini ("Claude and GPT models"), so Claude-through-agy is a step of its own.
# A caller that pins --tool (pjm) asks `aicli resolve` and builds for the answer.

[fallback]
at = 95

[[fallback.claude]]
label = "agy: Claude models"
tool = "agy"
group = "Claude and GPT models"
tiers = { low = "claude-sonnet-5-5-low", default = "claude-sonnet-5-5-high", deep = "claude-opus-5-5-high" }

[[fallback.claude]]
label = "agy: Gemini 3.8"
tool = "agy"
group = "Gemini Models"
tiers = { low = "gemini-3.8-flash-low", default = "gemini-3.8-flash-high", deep = "gemini-3.8-flash-high" }

# --- Workload Classes & Routing ----------------------------------------------
# Callers can pass `--class <name>` and optional `--client <id>` instead of
# hardcoding tools and models. routes.json, next to this file (or
# AICLI_ROUTES), overrides these live; `aicli route ...` edits it.

[classes.maintenance]
description = "Repository maintenance, CI fixes, security dependency updates"
frequency = "Daily/Weekly background batch"
tool = "agy"
tier = "low"

[classes.deep-spec]
description = "Complex architecture, multi-file specs, and deep PR reviews"
frequency = "Moderate (ticket creation & review)"
tool = "claude"
tier = "deep"

[classes.standard-dev]
description = "Standard code implementation, ticket subtask execution"
frequency = "High burst during active work"
tool = "claude"
tier = "default"

[classes.managerial-audit]
description = "Cross-project status auditing, watchdog, and scheduled scrum reports"
frequency = "4 times / day (07:30, 12:00, 17:00, 22:00)"
tool = "agy"
tier = "low"

[classes.lightweight-task]
description = "High-throughput data extraction, job scraping, metadata tagging"
frequency = "Continuous / On-demand"
tool = "agy"
tier = "low"

[classes.interactive-shell]
description = "Direct interactive human terminal sessions"
frequency = "On-demand by user"
tool = "claude"
tier = "default"

