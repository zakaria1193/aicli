# aicli's one config file. Everything a caller needs to know about the
# `claude` and `agy` CLIs - binary paths, model tiers, standard flags - lives
# here. This is the default; a deployment can put its own at
# ~/.config/aicli/aicli.toml or point AICLI_CONFIG at it.

usage_timeout = 30

[claude]
bin = "~/.local/bin/claude"
args = []
model_flag = "--model"
effort_flag = "--effort"

[claude.tiers]
low = "claude-haiku-5-5"
default = "claude-sonnet-5"
deep = "claude-opus-5-5"

[agy]
bin = "~/.local/bin/agy"
args = []
model_flag = "--model"
effort_flag = "--effort"
# Each agy model names its effort, and agy rejects an --effort that differs:
# when aicli adds the tier's model it drops the effort, so the tier decides.
model_sets_effort = true
# agy settings file whose `trustedWorkspaces` aicli extends so agy never asks "trust this folder".
trust_file = "~/.gemini/antigravity-cli/settings.json"

[agy.tiers]
low = "gemini-3.8-flash-low"
default = "gemini-4-hydrogen-medium"
deep = "gemini-4-hydrogen-high"

# --- Fallback -----------------------------------------------------------------
# Each workload class can define its own `fallback` step(s) (or disable fallback).
# Once the primary plan's five-hour or weekly bar reaches `at` percent, `aicli`
# moves runs of that class to its configured fallback if that fallback's quota
# group still has room. Before falling back, `aicli` relies on the reset timer
# (`next_ok_at`) and retests the primary choice once the reset window arrives.

# Keep `at` equal to the pause threshold of callers that gate on Claude usage (97 by default).
# Below it the primary is still worth using.
[fallback]
at = 97
# Reserve 20% quota for critical background maintenance & audits. Standard dev yields at 80%.
reserve = 20

# --- Workload Classes & Routing ----------------------------------------------
# Callers can pass `--class <name>` and optional `--client <id>` instead of
# hardcoding tools and models. routes.json, next to this file (or
# AICLI_ROUTES), overrides these live; `aicli route ...` edits it.

[classes.maintenance]
description = "Repository maintenance, CI fixes, security dependency updates"
frequency = "Daily/Weekly background batch"
tool = "agy"
tier = "low"
priority = "critical"

[classes.deep-spec]
description = "Complex architecture, multi-file specs, and deep PR reviews"
frequency = "Moderate (ticket creation & review)"
tool = "claude"
tier = "deep"

[classes.standard-dev]
description = "Standard code implementation, ticket subtask execution"
frequency = "High burst during active work"
tool = "agy"
tier = "default"
model = "gemini-4-hydrogen-medium"
fallback = { tool = "claude", model = "claude-sonnet-5", effort = "medium" }

[classes.managerial-audit]
description = "Cross-project status auditing, watchdog, and scheduled scrum reports"
frequency = "4 times / day (07:30, 12:00, 17:00, 22:00)"
tool = "agy"
tier = "low"
priority = "critical"

[classes.brainstorm]
description = "Divergent idea generation: exploring an opportunity into angles and ideas"
frequency = "On-demand, a few calls a day"
tool = "claude"
tier = "deep"
fallback = { tool = "agy", model = "gemini-4-argon-medium", group = "Gemini 4 Argon" }

[classes.conversation]
description = "Talking to a project agent: quick, turn by turn"
frequency = "On-demand, interactive"
tool = "claude"
tier = "default"
effort = "medium"
fallback = { tool = "agy", model = "gemini-4-argon-medium", group = "Gemini 4 Argon" }

[classes.conversation-deep]
description = "Talking to a project agent that must think and push back"
frequency = "On-demand, interactive"
tool = "claude"
tier = "deep"
fallback = { tool = "agy", model = "gemini-4-argon-medium", group = "Gemini 4 Argon" }

[classes.lightweight-task]
description = "High-throughput data extraction, job scraping, metadata tagging"
frequency = "Continuous / On-demand"
tool = "agy"
tier = "low"

[classes.career-assistant]
description = "Interactive career assistant answering questions and guiding users"
frequency = "On-demand, interactive"
tool = "agy"
model = "gemini-4-hydrogen-low"

[classes.career-coach]
description = "Deep career coaching, CV/cover letter tailoring, and fit scoring"
frequency = "Daily / On-demand high-tier runs"
tool = "agy"
tier = "deep"

[classes.deploy-engineer]
description = "Deploying a finished ticket and checking live status"
frequency = "A few runs a day, after CI green"
tool = "claude"
tier = "deep"

[classes.interactive-shell]
description = "Direct interactive human terminal sessions"
frequency = "On-demand by user"
tool = "claude"
tier = "default"

[classes.google-chrome-handler]
description = "Browser-authenticated tasks requiring Claude in Chrome (logged-in dashboard sessions)"
frequency = "On-demand, owner-approved restart from pjm"
tool = "claude"
tier = "default"
effort = "medium"
